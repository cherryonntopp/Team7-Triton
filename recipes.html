<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triton Food — Premium Recipes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --blue:      #C8DFF0;
            --blue-mid:  #A8C8E0;
            --blue-mid-dark: #accdfb;
            --blue-dark: #2a5a7a;
            --blue-deep: #1a3a52;
            --yellow:    #F5D98B;
            --yellow-dk: #5a3e00;
            --beige:     #F5F0E8;
            --beige-md:  #EDE5CC;
            --card-bg:   #FDFAF4;
            --border:    #E0D8C4;
            --text:      #1a2a1a;
            --muted:     #6a7a6a;
            --radius:    14px;
            --font-display: 'DM Serif Display', serif;
            --font-body:    'DM Sans', sans-serif;
        }

        body { 
            font-family: var(--font-body); 
            background-color: var(--beige); 
            color: var(--text);
            scroll-behavior: smooth;
        }

        h1, h2, h3, .display-font { font-family: var(--font-display); color: var(--blue-deep); }

        /* Navigation Styling */
        nav {
            background: var(--blue); 
            border-bottom: 1px solid var(--blue-mid);
        }
        .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--yellow); }

        /* Recipe Card Styling */
        .recipe-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: transform 0.2s ease;
        }
        .recipe-card:hover { transform: translateY(-5px); }

        /* Badge Styling */
        .badge {
            font-size: 10px; padding: 3px 9px; border-radius: 999px; font-weight: 600; text-transform: uppercase;
        }
        .badge-blue   { background: rgba(168,200,224,0.4); color: var(--blue-deep); }
        .badge-yellow { background: #FBF0C0; color: var(--yellow-dk); }
        .badge-critical { background: #fee2e2; color: #991b1b; }

        /* Hero Slider */
        .slide { display: none; }
        .slide.active { display: flex; animation: fadeIn 0.8s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .filter-btn.active {
            background: var(--yellow);
            color: var(--yellow-dk);
            border-color: var(--yellow);
        }
    </style>
</head>
<body>

    <!-- Header (Triton Style) -->
    <nav class="sticky top-0 z-50 px-6 h-[56px] flex items-center relative">

    <!-- Logo -->
    <a class="flex items-center gap-2 text-xl font-bold tracking-tight text-[var(--blue-deep)] decoration-none"
       href="index.html"
       style="font-family: var(--font-display);">
        <div class="logo-dot"></div>
        Food4Tritons
    </a>

    <!-- Center Navigation -->
    <div class="hidden md:flex gap-2 absolute left-1/2 -translate-x-1/2">
        <a href="index.html"
       class="text-sm text-[var(--blue-dark)] px-4 py-2 hover:bg-white/40 rounded-full transition">
       home
    </a>

    <a href="pantry.html"
       class="text-sm text-[var(--blue-dark)] px-4 py-2 hover:bg-white/40 rounded-full transition">
       pantry
    </a>

    <a href="clubs.html"
       class="text-sm text-[var(--blue-dark)] px-4 py-2 hover:bg-white/40 rounded-full transition">
       clubs
    </a>

    <a href="recipes.html"
       class="text-sm px-4 py-2 bg-[var(--yellow)] text-[var(--yellow-dk)] font-medium rounded-full">
       recipes
    </a>
    </div>

</nav>

    <!-- HERO SLIDER (Using Triton Blue) -->
    <section class="relative bg-[var(--blue-mid-dark)] border-b border-[var(--blue-mid)] overflow-hidden h-[450px]">
        <div id="slider-container" class="h-full">
            <!-- Slides injected by JS -->
        </div>

        <button onclick="changeSlide(-1)" class="absolute left-4 top-1/2 -translate-y-1/2 bg-white/30 hover:bg-white/50 p-3 rounded-full backdrop-blur-md transition">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button onclick="changeSlide(1)" class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/30 hover:bg-white/50 p-3 rounded-full backdrop-blur-md transition">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m9 18 6-6-9-6"/></svg>
        </button>
    </section>

    <!-- CATEGORY FILTERS -->
    <section class="max-w-6xl mx-auto px-4 pt-12 text-center">
        <div class="sec-label mb-2 uppercase text-[10px] tracking-widest text-[#8a7a5a] font-bold">Explore Categories</div>
        <h2 class="text-4xl mb-8">What are we cooking?</h2>
        <div class="flex flex-wrap justify-center gap-3">
            <button onclick="filterRecipes('all')" class="filter-btn active px-6 py-2 rounded-full border border-[var(--border)] bg-[var(--card-bg)] text-sm transition">All</button>
            <button onclick="filterRecipes('quickest')" class="filter-btn px-6 py-2 rounded-full border border-[var(--border)] bg-[var(--card-bg)] text-sm transition">Quickest</button>
            <button onclick="filterRecipes('least')" class="filter-btn px-6 py-2 rounded-full border border-[var(--border)] bg-[var(--card-bg)] text-sm transition">Least Ingredients</button>
            <button onclick="filterRecipes('easiest')" class="filter-btn px-6 py-2 rounded-full border border-[var(--border)] bg-[var(--card-bg)] text-sm transition">Easiest</button>
            <button onclick="filterRecipes('vegetarian')" class="filter-btn px-6 py-2 rounded-full border border-[var(--border)] bg-[var(--card-bg)] text-sm transition">Vegetarian</button>
        </div>
    </section>

    <!-- RECIPE GRID -->
    <main class="max-w-6xl mx-auto px-4 py-12">
        <div id="recipe-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Cards injected by JS -->
        </div>
    </main>

    <!-- MODAL (Triton Rounded Styling) -->
    <div id="recipe-modal" class="fixed inset-0 bg-[var(--blue-deep)]/40 hidden z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[var(--card-bg)] rounded-[20px] border border-[var(--border)] max-w-3xl w-full max-h-[90vh] overflow-y-auto p-10 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-5 right-5 text-3xl text-[var(--muted)] hover:text-[var(--text)]">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <footer class="bg-[var(--)] border-t border-[var(--blue-mid)] py-8 px-6 text-center">
        <span class="text-sm text-[var(--blue-dark)]">Triton Food Recipes &nbsp;·&nbsp; UC San Diego</span>
    </footer>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1VOE1i8R2X3B9xgBf9wZ3tAM_iueKT6ShM_7XRvf3cRA/export?format=csv'; 
        let recipes = [];
        let currentSlide = 0;

        function init() {
            Papa.parse(SHEET_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    recipes = results.data.map(row => ({
                        ...row,
                        id: parseInt(row.id),
                        organization: row.organization || "Triton Kitchen",
                        category: row.category ? row.category.split(',').map(s => s.trim()) : [],
                        ingredients: row.ingredients ? row.ingredients.split(';').map(s => s.trim()) : [],
                        critical: row.critical ? row.critical.split(',').map(s => s.trim()) : [],
                        steps: row.steps ? row.steps.split(';').map(s => s.trim()) : []
                    })).filter(row => row.name);

                    renderSlider();
                    renderRecipes();
                    showSlide(0);
                }
            });
        }

        function renderSlider() {
            const container = document.getElementById('slider-container');
            container.innerHTML = recipes.slice(0, 3).map((r, index) => `
                <div class="slide h-full flex-col md:flex-row w-full">
                    <div class="w-full md:w-1/2 p-12 flex flex-col justify-center">
                        <span class="badge badge-yellow w-fit mb-4">Featured Recipe</span>
                        <h2 class="text-5xl md:text-6xl mb-4 leading-tight">${r.name}</h2>
                        <p class="text-[var(--blue-dark)] mb-6 text-lg leading-relaxed">${r.summary}</p>
                        <div class="flex gap-4 mb-8">
                            <span class="badge badge-blue">⏱ ${r.time}</span>
                            <span class="badge badge-blue">📊 ${r.difficulty}</span>
                        </div>
                        <button onclick="openModal(${r.id})" class="w-fit bg-[var(--blue-deep)] text-white px-8 py-3 rounded-full hover:bg-[var(--blue-dark)] transition font-bold uppercase text-xs tracking-widest">
                            View Full Recipe
                        </button>
                    </div>
                    <div class="w-full md:w-1/2 h-full p-8">
                        <img src="${r.image}" class="w-full h-full object-cover rounded-[20px] shadow-lg" alt="${r.name}">
                    </div>
                </div>
            `).join('');
        }

        function renderRecipes(filter = 'all') {
            const grid = document.getElementById('recipe-grid');
            grid.innerHTML = '';
            const filtered = filter === 'all' ? recipes : recipes.filter(r => r.category.includes(filter));

            filtered.forEach(recipe => {
                grid.innerHTML += `
                    <article class="recipe-card shadow-sm cursor-pointer" onclick="openModal(${recipe.id})">
                        <div class="h-56 overflow-hidden">
                            <img src="${recipe.image}" class="w-full h-full object-cover transition-transform duration-500 hover:scale-110">
                        </div>
                        <div class="p-6">
                            <span class="text-[10px] text-[var(--muted)] font-bold uppercase tracking-widest block mb-1">${recipe.organization}</span>
                            <h3 class="text-2xl mb-3">${recipe.name}</h3>
                            <div class="flex gap-2 mb-4">
                                <span class="badge badge-blue">${recipe.difficulty}</span>
                                <span class="badge badge-blue">${recipe.time}</span>
                            </div>
                            <p class="text-sm text-[var(--muted)] mb-6 line-clamp-2">${recipe.summary}</p>
                            ${recipe.critical.length > 0 ? `
                                <div class="badge badge-critical w-full text-center">Contains: ${recipe.critical.join(', ')}</div>
                            ` : ''}
                        </div>
                    </article>
                `;
            });
        }

        function filterRecipes(cat) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderRecipes(cat);
        }

        function openModal(id) {
            const r = recipes.find(rec => rec.id === id);
            document.getElementById('modal-content').innerHTML = `
                <span class="badge badge-blue mb-2">${r.organization}</span>
                <h2 class="text-4xl mb-6">${r.name}</h2>
                <div class="grid md:grid-cols-2 gap-10">
                    <div>
                        <h4 class="font-bold uppercase tracking-widest text-[10px] text-[#8a7a5a] mb-4 pb-2 border-b border-[var(--border)]">Ingredients</h4>
                        <ul class="space-y-2 text-sm">
                            ${r.ingredients.map(i => `<li class="flex items-start gap-2"><span>•</span> ${i}</li>`).join('')}
                        </ul>
                    </div>
                    <div>
                        <h4 class="font-bold uppercase tracking-widest text-[10px] text-[#8a7a5a] mb-4 pb-2 border-b border-[var(--border)]">Instructions</h4>
                        <ol class="space-y-4 text-sm list-decimal pl-4">
                            ${r.steps.map(s => `<li>${s}</li>`).join('')}
                        </ol>
                    </div>
                </div>
            `;
            document.getElementById('recipe-modal').classList.remove('hidden');
        }

        function showSlide(n) {
            const slides = document.querySelectorAll('.slide');
            if(!slides.length) return;
            slides.forEach(s => s.classList.remove('active'));
            currentSlide = (n + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        function changeSlide(n) { showSlide(currentSlide + n); }
        function closeModal() { document.getElementById('recipe-modal').classList.add('hidden'); }

        init();
        setInterval(() => changeSlide(1), 8000);
    </script>
</body>
</html>
